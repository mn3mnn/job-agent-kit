<!-- career-ops-template
name: Compact (ATS)
max_pages: 1
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume</title>
<style>
  /* Compact variant of the base template: same ATS-safe system-font stack (no
     Google Fonts import, no ligature/glyph-advance bugs), same single-column
     structure and class names, no decorative cards/box-shadow/background
     color. The only change is denser vertical rhythm (line-height, section
     and list-item margins, page margin) so more real content fits per page
     without shrinking body text below a human-readable size. */
  :root {
    --accent-color: hsl(187 74% 32%);
    --font-family: "Liberation Sans", 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    --font-size: 11px;
    --page-margin: 0.5in;
  }
  @page { margin: var(--page-margin); }

  /* ATS-safe typography: see cv-template.html for the full rationale
     (bundled variable webfonts corrupt ATS text extraction via glyph-advance
     spacing bugs, e.g. "SUM M ARY"). Same fix applied here. */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.35;
    color: #1a1a2e;
    background: #ffffff;
    padding: 0;
    margin: 0;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  .page {
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
    padding: 2px 0;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 14px;
  }

  .header h1 {
    font-family: var(--font-family);
    font-size: 26px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    line-height: 1.1;
  }

  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, var(--accent-color), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-bottom: 7px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-family: var(--font-family);
    font-size: 10.5px;
    line-height: 1.3;
    color: #555;
  }

  .contact-row a {
    color: #555;
    text-decoration: none;
  }

  .contact-row .separator {
    color: #ccc;
  }

  /* === OPTIONAL PROFILE PHOTO === */
  .cv-photo {
    float: right;
    width: 76px;
    height: 96px;
    object-fit: cover;
    margin: 0 0 6px 12px;
    border-radius: 3px;
    border: 1px solid #e2e2e2;
  }

  .cv-photo--rounded { border-radius: 8px; }
  .cv-photo--circle { border-radius: 50%; aspect-ratio: 1; height: 76px; }
  .cv-photo--square { border-radius: 0; aspect-ratio: 1; height: 76px; }

  /* === SECTIONS === */
  .section {
    margin-bottom: 11px;
  }

  .section-title {
    font-family: var(--font-family);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-color);
    border-bottom: 1.5px solid #e2e2e2;
    padding-bottom: 3px;
    margin-bottom: 6px;
    line-height: 1.15;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: var(--font-size);
    line-height: 1.45;
    color: #2f2f2f;
  }

  .summary-text strong {
    font-weight: 700;
    color: #1a1a1a;
  }

  a {
    white-space: nowrap;
  }

  /* === CORE COMPETENCIES === */
  .competencies-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .competency-tag {
    font-family: var(--font-family);
    font-size: 10px;
    font-weight: 500;
    color: hsl(187, 74%, 28%);
    background: hsl(187, 40%, 95%);
    padding: 3px 9px;
    border-radius: 3px;
    border: 1px solid hsl(187, 40%, 88%);
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 9px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2px;
  }

  .job-company {
    font-family: var(--font-family);
    font-size: 12px;
    font-weight: 600;
    color: hsl(270, 70%, 45%);
  }

  .job-period {
    font-size: 10.5px;
    color: #777;
    white-space: nowrap;
  }

  .job-role {
    font-size: var(--font-size);
    font-weight: 600;
    color: #333;
    margin-bottom: 3px;
  }

  .job-location {
    font-size: 10px;
    color: #888;
  }

  .job ul {
    padding-left: 16px;
    margin-top: 3px;
  }

  .job li {
    font-size: 10.5px;
    line-height: 1.4;
    color: #333;
    margin-bottom: 2px;
  }

  .job li strong {
    font-weight: 600;
  }

  /* === PROJECTS === */
  .project {
    margin-bottom: 7px;
  }

  .project-title {
    font-family: var(--font-family);
    font-size: 11.5px;
    font-weight: 600;
    color: hsl(270, 70%, 45%);
  }

  .project-badge {
    font-size: 9px;
    font-weight: 500;
    color: var(--accent-color);
    background: hsl(187, 40%, 95%);
    padding: 1px 6px;
    border-radius: 2px;
    margin-left: 6px;
  }

  .project-desc {
    font-size: 10.5px;
    color: #444;
    margin-top: 2px;
    line-height: 1.4;
  }

  .project-tech {
    font-size: 9.5px;
    color: #888;
    margin-top: 2px;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 5px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .edu-title {
    font-weight: 600;
    font-size: var(--font-size);
    color: #333;
  }

  .edu-org {
    color: hsl(270, 70%, 45%);
    font-weight: 500;
  }

  .edu-year {
    font-size: 10px;
    color: #777;
    white-space: nowrap;
  }

  .edu-desc {
    font-size: 10px;
    color: #666;
    margin-top: 1px;
    line-height: 1.35;
  }

  /* === CERTIFICATIONS === */
  .cert-table {
    display: table;
    width: 100%;
  }

  .cert-item {
    display: table-row;
  }

  .cert-item > * {
    display: table-cell;
    vertical-align: baseline;
    padding-bottom: 4px;
  }

  .cert-title {
    font-size: 10.5px;
    font-weight: 500;
    color: #333;
  }

  .cert-org {
    color: hsl(270, 70%, 45%);
    white-space: nowrap;
  }

  .cert-year {
    font-size: 10px;
    color: #777;
    white-space: nowrap;
    text-align: right;
    width: 44px;
  }

  /* === AWARDS === */
  .award-table {
    display: table;
    width: 100%;
  }

  .award-item {
    display: table-row;
  }

  .award-item > * {
    display: table-cell;
    vertical-align: baseline;
    padding-bottom: 4px;
  }

  .award-title {
    font-size: 10.5px;
    font-weight: 500;
    color: #333;
  }

  .award-org {
    color: hsl(270, 70%, 45%);
    white-space: nowrap;
  }

  .award-year {
    font-size: 10px;
    color: #777;
    white-space: nowrap;
    text-align: right;
    width: 44px;
  }

  /* === SKILLS === */
  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
  }

  .skill-item {
    font-size: 10.5px;
    color: #444;
  }

  .skill-category {
    font-weight: 600;
    color: #333;
    font-size: 10.5px;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      padding: 0 0.18in 0 0;
    }
  }

  /* === PAGE BREAK CONTROL === */
  .header,
  .edu-item,
  .cert-item,
  .competency-tag,
  .skill-item {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .section-title,
  .job-company,
  .job-role,
  .job-location,
  .project-title {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* === RTL (Arabic) Support === */
  html[lang="ar"] body {
    direction: rtl;
    text-align: right;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .header h1,
  html[lang="ar"] .section-title,
  html[lang="ar"] .job-company,
  html[lang="ar"] .project-title,
  html[lang="ar"] .competency-tag,
  html[lang="ar"] .skill-category {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .header-gradient {
    background: linear-gradient(to left, var(--accent-color), hsl(270, 70%, 45%));
  }

  html[lang="ar"] .job ul {
    padding-right: 16px;
    padding-left: 0;
  }

  html[lang="ar"] .project-badge {
    margin-right: 6px;
    margin-left: 0;
  }

  html[lang="ar"] .cert-year {
    text-align: left;
  }

  html[lang="ar"] .cert-table {
    direction: rtl;
  }

  html[lang="ar"] .cv-photo {
    float: left;
    margin: 0 12px 6px 0;
  }

  /* === CJK (Japanese) font fallback === */
  html[lang="ja"] body {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
      'Yu Gothic', 'YuGothic', 'Noto Sans CJK JP', 'Noto Sans JP',
      Meiryo, 'MS PGothic', sans-serif;
  }

  html[lang="ja"] .header h1,
  html[lang="ja"] .section-title,
  html[lang="ja"] .job-company,
  html[lang="ja"] .project-title,
  html[lang="ja"] .competency-tag,
  html[lang="ja"] .skill-category {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
      'Yu Gothic', 'YuGothic', 'Noto Sans CJK JP', 'Noto Sans JP',
      Meiryo, 'MS PGothic', sans-serif;
  }

  /* === Simplified Chinese typography === */
  html[lang="zh-CN"] body,
  html[lang="zh"] body {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC',
      'Noto Sans SC', 'Source Han Sans SC', sans-serif;
    line-break: strict;
    word-break: normal;
    overflow-wrap: break-word;
  }

  html[lang="zh-CN"] .header h1,
  html[lang="zh-CN"] .section-title,
  html[lang="zh-CN"] .job-company,
  html[lang="zh-CN"] .project-title,
  html[lang="zh-CN"] .contact-row,
  html[lang="zh-CN"] .competency-tag,
  html[lang="zh-CN"] .skill-category,
  html[lang="zh"] .header h1,
  html[lang="zh"] .section-title,
  html[lang="zh"] .job-company,
  html[lang="zh"] .project-title,
  html[lang="zh"] .contact-row,
  html[lang="zh"] .competency-tag,
  html[lang="zh"] .skill-category {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC',
      'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  }

  html[lang="zh-CN"] .summary-text,
  html[lang="zh"] .summary-text,
  html[lang="zh-CN"] .job li,
  html[lang="zh"] .job li {
    line-height: 1.5;
  }

  html[lang="zh-CN"] .section-title,
  html[lang="zh"] .section-title {
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
